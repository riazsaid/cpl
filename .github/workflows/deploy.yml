name: Deploy to DreamHost

on:
  push:
    branches:
      - main   # deploy whenever you push to main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout your repo
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: (Optional) Build step for Node/React/etc.
      # Remove if you don’t need a build
      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      # Step 3: Deploy via SCP
      - name: Copy files to DreamHost
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DH_HOST }}
          username: ${{ secrets.DH_USER }}
          key: ${{ secrets.DH_SSH_KEY }}
          source: "build/*"   # or "." if no build step
          target: "second2026.dreamhosters.com"
