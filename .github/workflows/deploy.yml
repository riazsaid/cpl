name: Deploy WordPress Site

on:
  push:
    branches:
      - main   # deploy when you push to main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout your repo
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Deploy files via SCP
      - name: Copy files to DreamHost
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DH_HOST }}
          username: ${{ secrets.DH_USER }}
          key: ${{ secrets.DH_SSH_KEY }}
          source: "."   # copy everything in repo
          target: "second2026.dreamhosters.com"
