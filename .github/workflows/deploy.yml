name: Deploy WordPress Site
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy files to DreamHost
        uses: appleboy/scp-action@v0.1.9
        with:
          host: ${{ secrets.DH_HOST }}
          username: ${{ secrets.DH_USER }}
          password: ${{ secrets.DH_SSH_KEY }}
          source: "."
          target: "/home/${{ secrets.DH_USER }}/customphenoliclabels.com"
          rm: false
          exclude: |
            .git
            .gitignore
            .ddev
            docs
            Designs
            team-sync
